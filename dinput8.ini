[Settings]
EnableMods=true               # Lets loose files on disk override the game's own files (true/false, default: true)
EnablePlugins=true            # Loads plugins from the plugins folder (true/false, default: true)
EnableGUI=true                # Enables the in-game menu (true/false, default: true)
ToggleKey=Insert              # Key that opens/closes the in-game menu (e.g. Insert, Home, F1, A, default: Insert)

